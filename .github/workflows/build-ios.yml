name: Build iOS app

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show build tools
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build unsigned Release app
        run: |
          set -o pipefail
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package app artifact
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/3105.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RUNNER_TEMP/3105-unsigned.app.zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ios-release
          path: |
            ${{ runner.temp }}/3105-unsigned.app.zip
            ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: error
          retention-days: 14
