name: Build iOS app

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show build tools
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build unsigned Release app
        run: |
          set -o pipefail
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme ExternalSystem \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package app artifact
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/ExternalSystem.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/ExternalSystem-Protected.ipa" Payload)
          unzip -t "$RUNNER_TEMP/ExternalSystem-Protected.ipa"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: external-system-protected-ipa
          path: |
            ${{ runner.temp }}/ExternalSystem-Protected.ipa
            ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: error
          retention-days: 14
